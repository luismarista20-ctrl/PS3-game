<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sketchbook Hero - Hand-Drawn Platformer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #e5e5e0;
      font-family: 'Patrick Hand', cursive, sans-serif;
    }
    /* Subtle paper grain & vignette */
    #paper-wrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #fdfdfb 60%, #f1f0ea 100%);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .sketch-btn {
      font-family: 'Patrick Hand', cursive, sans-serif;
      border: 2.5px solid #4a4a4a;
      border-radius: 12px 16px 14px 18px / 16px 12px 18px 14px;
      background: #fdfdfb;
      color: #333;
      box-shadow: 2px 3px 0px #555;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.08s ease;
      touch-action: manipulation;
    }
    .sketch-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 1px 0px #555;
    }

    /* Ergonomic Hand-Drawn Mobile Touch Controls */
    .touch-pad-btn {
      font-family: 'Patrick Hand', cursive, sans-serif;
      border: 3px solid #484848;
      background: rgba(253, 253, 251, 0.78);
      backdrop-filter: blur(2px);
      color: #333;
      box-shadow: 3px 4px 0px rgba(72, 72, 72, 0.85);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background-color 0.06s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-pad-btn.is-pressed,
    .touch-pad-btn:active {
      transform: translate(2px, 3px) scale(0.96);
      box-shadow: 1px 1px 0px rgba(72, 72, 72, 0.85);
      background: rgba(235, 233, 224, 0.94);
    }
    .move-btn {
      border-radius: 22px 26px 24px 28px / 26px 22px 28px 24px;
    }
    .action-btn {
      border-radius: 9999px;
      background: rgba(255, 244, 228, 0.84);
      border-color: #4a3b2c;
      box-shadow: 3px 4px 0px rgba(74, 59, 44, 0.85);
    }
    .action-btn.is-pressed,
    .action-btn:active {
      background: rgba(255, 196, 120, 0.92);
      box-shadow: 1px 1px 0px rgba(74, 59, 44, 0.85);
    }

    /* Safe area padding for notched phones */
    #mobile-controls {
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <div id="paper-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- Top-Left Minimalist Pencil HUD (Hearts drawn cleanly underneath on canvas) -->
    <div id="top-hud" class="fixed top-2.5 left-3 sm:top-3 sm:left-4 z-10 flex flex-wrap items-center gap-2 sm:gap-3 pointer-events-auto">
      <div class="px-2.5 py-0.5 sm:px-3 sm:py-1 bg-[#fdfdfb]/90 border-2 border-[#555] rounded-xl text-[#333] text-base sm:text-xl shadow-[2px_2px_0_#666]">
        Stage: <span id="stageDisplay" class="font-bold">1</span> &nbsp;|&nbsp; Score: <span id="scoreDisplay" class="font-bold">0</span>
      </div>
      <button id="muteBtn" class="sketch-btn px-2.5 py-0.5 sm:px-3 sm:py-1 text-sm sm:text-lg" title="Toggle Sound">
        🔊 Sound
      </button>
      <button id="restartTopBtn" class="sketch-btn px-2.5 py-0.5 sm:px-3 sm:py-1 text-sm sm:text-lg" title="Restart Game">
        ↺ Reset
      </button>
    </div>

    <!-- Top-Right Orientation Tip for Narrow Portrait Screens -->
    <div id="portraitTip" class="sm:hidden fixed top-12 right-3 z-10 px-2.5 py-1 bg-[#fdfdfb]/85 border border-[#666] rounded-xl text-xs text-[#444] shadow-[1px_2px_0_#666] pointer-events-none">
      ↻ Rotate phone for wider view
    </div>

    <!-- Subtle Helper Hint Banner (fades after first action) -->
    <div id="hintBanner" class="fixed top-14 sm:top-4 left-1/2 -translate-x-1/2 z-10 px-3.5 py-1 bg-[#fdfdfb]/95 border-2 border-[#555] rounded-2xl text-[#3a3a3a] text-sm sm:text-lg text-center pointer-events-none shadow-[2px_2px_0_#666] transition-opacity duration-500 max-w-[92vw]">
      <span class="hidden md:inline">Use <b>Arrow Keys</b> to move &amp; <b>Space</b> to Jump + Fireball!</span>
      <span class="md:hidden">Use <b>◀ ▶</b> to walk &amp; tap <b>JUMP &amp; FIRE</b> on the right!</span>
    </div>

    <!-- Ergonomic Two-Thumb Mobile Touch Controls (Bottom Corners) -->
    <div id="mobile-controls" class="fixed inset-x-0 bottom-0 z-10 flex items-end justify-between pointer-events-none">
      <!-- Bottom-Left: Sliding Multi-Touch Movement Pad (Left / Right) -->
      <div id="moveZone" class="flex items-center gap-3 sm:gap-4 pointer-events-auto">
        <button
          id="btnLeft"
          type="button"
          aria-label="Move Left"
          class="touch-pad-btn move-btn w-20 h-20 sm:w-24 sm:h-24 select-none"
        >
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#3f3f3f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7L11 18L23 29" />
            <path d="M24 8.5L12.5 18L24 27.5" stroke-opacity="0.35" stroke-width="2" />
          </svg>
        </button>

        <button
          id="btnRight"
          type="button"
          aria-label="Move Right"
          class="touch-pad-btn move-btn w-20 h-20 sm:w-24 sm:h-24 select-none"
        >
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#3f3f3f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 7L25 18L13 29" />
            <path d="M12 8.5L23.5 18L12 27.5" stroke-opacity="0.35" stroke-width="2" />
          </svg>
        </button>
      </div>

      <!-- Bottom-Right: Dedicated Jump & Fireball Action Button -->
      <div class="pointer-events-auto">
        <button
          id="btnAction"
          type="button"
          aria-label="Jump and Throw Fireball"
          class="touch-pad-btn action-btn w-24 h-24 sm:w-28 sm:h-28 flex-col gap-0.5 select-none"
        >
          <!-- Hand-drawn Flame + Up Arrow Icon -->
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#4a3525" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 5C18 5 26 12 26 20C26 24.4 22.4 28 18 28C13.6 28 10 24.4 10 20C10 17 11.8 14 13.5 12.5C13.2 15 14.5 16.5 16 16.5C15.2 12.5 18 5 18 5Z" fill="rgba(255, 145, 45, 0.55)" />
            <path d="M18 24V15M18 15L14.5 18.5M18 15L21.5 18.5" stroke="#3b2818" stroke-width="2.6" />
          </svg>
          <span class="text-sm sm:text-base font-bold leading-none tracking-wide text-[#3b2818]">JUMP &amp; FIRE</span>
        </button>
      </div>
    </div>

    <!-- Modal Overlay for Game Over / Victory -->
    <div id="overlayModal" class="hidden fixed inset-0 z-20 bg-black/25 backdrop-blur-[1px] flex items-center justify-center p-4">
      <div class="bg-[#fdfdfb] border-[3px] border-[#444] rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-[6px_6px_0_#444]">
        <h2 id="modalTitle" class="text-3xl sm:text-4xl font-bold text-[#2f2f2f] mb-2">Out of Hearts!</h2>
        <p id="modalSubtitle" class="text-xl text-[#555] mb-5">Final Score: 0</p>
        <button id="modalActionBtn" class="sketch-btn px-6 py-2.5 text-2xl font-bold cursor-pointer">
          Draw Again!
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * SKETCHBOOK HERO (Mobile & Desktop Edition)
     * - Left stick-figure boy with hair tuft & smile
     * - 3 platforms separated by 2 spike pits
     * - Tall chomping creature on the right high ledge
     * - Angled cannon on the lower step firing shaded cannonballs
     * - Warp pipe at bottom right
     * - 3 hearts positioned cleanly in upper-left HUD so bottom corners are free for thumb controls
     * - Ergonomic bottom-left Left/Right touch buttons (with thumb-slide multi-touch) + bottom-right Jump & Fireball button
     * - Full desktop keyboard controls preserved (Arrows / WASD + Space)
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI DOM references
    const stageDisplay = document.getElementById('stageDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const muteBtn = document.getElementById('muteBtn');
    const restartTopBtn = document.getElementById('restartTopBtn');
    const hintBanner = document.getElementById('hintBanner');
    const overlayModal = document.getElementById('overlayModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalActionBtn = document.getElementById('modalActionBtn');

    // Mobile Touch Button references
    const moveZone = document.getElementById('moveZone');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnAction = document.getElementById('btnAction');

    // Virtual coordinate space (1280 x 720)
    const VW = 1280;
    const VH = 720;

    // Audio Synthesizer using Web Audio API (no external sound URLs)
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jumpFire') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.19);
      } else if (type === 'enemyHit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.22);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.23);
        osc.start(now);
        osc.stop(now + 0.24);
      } else if (type === 'cannon') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.17);
      } else if (type === 'hurt') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.28);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.31);
      } else if (type === 'stageClear') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.setValueAtTime(440, now + 0.09);
        osc.frequency.setValueAtTime(660, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇 Muted' : '🔊 Sound';
    });

    // Game State
    const state = {
      stage: 1,
      score: 0,
      hearts: 3,
      maxHearts: 3,
      gameOver: false,
      wobbleTime: 0,
      hintDismissed: false,
      fireCooldown: 0,
      screenShake: 0
    };

    // Player Entity
    const player = {
      x: 200,
      y: 455,
      vx: 0,
      vy: 0,
      width: 44,
      height: 112,
      speed: 340,
      jumpPower: -720,
      onGround: false,
      facing: 1,
      walkCycle: 0,
      invulnTimer: 0,
      mouthOpenTimer: 0
    };

    // Level Geometry
    const platforms = [
      { id: 'plat1', x: 0, y: 455, w: 350, h: 265 },
      { id: 'plat2', x: 455, y: 455, w: 325, h: 265 },
      { id: 'plat3_high', x: 870, y: 455, w: 185, h: 265 },
      { id: 'plat3_low', x: 1055, y: 525, w: 110, h: 195 }
    ];

    // Spike pits between platforms
    const spikes = [
      { x: 350, y: 655, w: 105, h: 65, count: 4 },
      { x: 780, y: 655, w: 90, h: 65, count: 3 }
    ];

    // Bottom-right goal/warp pipe
    const goalPipe = {
      x: 1178,
      y: 625,
      w: 88,
      h: 95
    };

    // Chomping Monster on Platform 3 High Section
    const monster = {
      x: 935,
      y: 455,
      headY: 315,
      hp: 2,
      maxHp: 2,
      alive: true,
      chompPhase: 0,
      hitFlash: 0
    };

    // Angled Cannon on Platform 3 Lower Step
    const cannon = {
      x: 1105,
      y: 515,
      angle: -Math.PI * 0.72,
      fireTimer: 1.6,
      fireInterval: 2.5,
      recoil: 0
    };

    // Projectiles & Particles
    let fireballs = [];
    let cannonballs = [];
    let particles = [];

    // Input Tracking (Keyboard + Touch)
    const keys = {
      left: false,
      right: false,
      up: false,
      down: false
    };

    const touchInput = {
      left: false,
      right: false
    };

    function dismissHint() {
      if (!state.hintDismissed) {
        state.hintDismissed = true;
        hintBanner.style.opacity = '0';
      }
    }

    // Core Action: Jump AND Throw Fireball!
    function triggerJumpAndFireball() {
      if (state.gameOver) return;
      initAudio();
      dismissHint();

      let didAction = false;

      // Jump if standing on a platform
      if (player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
        didAction = true;
        spawnPencilDust(player.x, player.y, 6);
      }

      // Throw a fireball
      if (state.fireCooldown <= 0) {
        state.fireCooldown = 0.26;
        player.mouthOpenTimer = 0.25;
        fireballs.push({
          x: player.x + player.facing * 26,
          y: player.y - 68,
          vx: player.facing * 560,
          vy: -130,
          radius: 14,
          life: 2.2,
          spin: 0
        });
        didAction = true;
      }

      if (didAction) {
        playSound('jumpFire');
      }
    }

    function spawnPencilDust(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y - Math.random() * 15,
          vx: (Math.random() - 0.5) * 140,
          vy: -Math.random() * 110 - 20,
          size: 3 + Math.random() * 4,
          life: 0.35 + Math.random() * 0.25,
          maxLife: 0.6,
          type: 'graphite'
        });
      }
    }

    function spawnFireSparks(x, y, count) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 180;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 4 + Math.random() * 5,
          life: 0.3 + Math.random() * 0.25,
          maxLife: 0.55,
          type: 'flame'
        });
      }
    }

    function resetPlayerPosition() {
      player.x = 175;
      player.y = 455;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      player.facing = 1;
      player.invulnTimer = 1.6;
    }

    function setupStage(stageNum) {
      state.stage = stageNum;
      stageDisplay.textContent = state.stage;
      scoreDisplay.textContent = state.score;

      resetPlayerPosition();
      fireballs = [];
      cannonballs = [];
      particles = [];

      monster.alive = true;
      monster.maxHp = Math.min(2 + Math.floor((stageNum - 1) / 2), 5);
      monster.hp = monster.maxHp;
      monster.hitFlash = 0;

      cannon.fireInterval = Math.max(1.15, 2.5 - (stageNum - 1) * 0.22);
      cannon.fireTimer = 1.0;
    }

    function fullRestart() {
      state.score = 0;
      state.hearts = state.maxHearts;
      state.gameOver = false;
      overlayModal.classList.add('hidden');
      setupStage(1);
    }

    restartTopBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fullRestart();
    });

    modalActionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fullRestart();
    });

    // =========================================================================
    // ERGONOMIC MOBILE TOUCH CONTROLS (Multi-Touch + Smooth Thumb Slide)
    // =========================================================================

    function updateMoveButtonsVisual() {
      btnLeft.classList.toggle('is-pressed', touchInput.left);
      btnRight.classList.toggle('is-pressed', touchInput.right);
    }

    // Evaluate all active touches inside the Left/Right movement zone so the user
    // can slide their left thumb smoothly between Left and Right without lifting!
    function evaluateMoveTouches(e) {
      let leftActive = false;
      let rightActive = false;

      const leftRect = btnLeft.getBoundingClientRect();
      const rightRect = btnRight.getBoundingClientRect();
      // Generous hit padding around each arrow button
      const pad = 12;

      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        const x = t.clientX;
        const y = t.clientY;

        if (
          x >= leftRect.left - pad &&
          x <= leftRect.right + pad &&
          y >= leftRect.top - pad &&
          y <= leftRect.bottom + pad
        ) {
          leftActive = true;
        }
        if (
          x >= rightRect.left - pad &&
          x <= rightRect.right + pad &&
          y >= rightRect.top - pad &&
          y <= rightRect.bottom + pad
        ) {
          rightActive = true;
        }
      }

      touchInput.left = leftActive;
      touchInput.right = rightActive;
      updateMoveButtonsVisual();

      if (leftActive || rightActive) {
        initAudio();
        dismissHint();
      }
    }

    moveZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      evaluateMoveTouches(e);
    }, { passive: false });

    moveZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      evaluateMoveTouches(e);
    }, { passive: false });

    moveZone.addEventListener('touchend', (e) => {
      e.preventDefault();
      evaluateMoveTouches(e);
    }, { passive: false });

    moveZone.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      evaluateMoveTouches(e);
    }, { passive: false });

    // Also support mouse clicks on the Left/Right buttons for desktop testing
    btnLeft.addEventListener('mousedown', (e) => {
      e.preventDefault();
      touchInput.left = true;
      updateMoveButtonsVisual();
      dismissHint();
    });
    btnRight.addEventListener('mousedown', (e) => {
      e.preventDefault();
      touchInput.right = true;
      updateMoveButtonsVisual();
      dismissHint();
    });
    window.addEventListener('mouseup', () => {
      if (touchInput.left || touchInput.right) {
        touchInput.left = false;
        touchInput.right = false;
        updateMoveButtonsVisual();
      }
      btnAction.classList.remove('is-pressed');
    });

    // Dedicated Jump & Fireball Action Button (Bottom-Right)
    btnAction.addEventListener('touchstart', (e) => {
      e.preventDefault();
      btnAction.classList.add('is-pressed');
      triggerJumpAndFireball();
    }, { passive: false });

    btnAction.addEventListener('touchend', (e) => {
      e.preventDefault();
      btnAction.classList.remove('is-pressed');
    }, { passive: false });

    btnAction.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      btnAction.classList.remove('is-pressed');
    }, { passive: false });

    btnAction.addEventListener('mousedown', (e) => {
      e.preventDefault();
      btnAction.classList.add('is-pressed');
      triggerJumpAndFireball();
    });

    // =========================================================================
    // DESKTOP KEYBOARD CONTROLS (Preserved: Arrows move, Space shoots/jumps)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (state.gameOver) {
        if (e.code === 'Space' || e.code === 'Enter') {
          fullRestart();
        }
        return;
      }

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
        dismissHint();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
        dismissHint();
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        keys.down = true;
      } else if (
        e.code === 'Space' ||
        e.code === 'ArrowUp' ||
        e.code === 'KeyW' ||
        e.code === 'KeyZ' ||
        e.code === 'KeyX'
      ) {
        e.preventDefault();
        if (!e.repeat) {
          triggerJumpAndFireball();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    });

    // Damage player & deduct a heart
    function damagePlayer() {
      if (player.invulnTimer > 0 || state.gameOver) return;

      state.hearts = Math.max(0, state.hearts - 1);
      state.screenShake = 0.25;
      playSound('hurt');
      spawnPencilDust(player.x, player.y - 50, 14);

      if (state.hearts <= 0) {
        state.gameOver = true;
        touchInput.left = false;
        touchInput.right = false;
        updateMoveButtonsVisual();
        modalTitle.textContent = 'Out of Hearts!';
        modalSubtitle.textContent = `You reached Stage ${state.stage} with ${state.score} points!`;
        modalActionBtn.textContent = 'Play Again';
        overlayModal.classList.remove('hidden');
      } else {
        resetPlayerPosition();
      }
    }

    // Physics & Simulation Update
    function update(dt) {
      state.wobbleTime += dt;
      if (state.fireCooldown > 0) state.fireCooldown -= dt;
      if (state.screenShake > 0) state.screenShake -= dt;
      if (player.invulnTimer > 0) player.invulnTimer -= dt;
      if (player.mouthOpenTimer > 0) player.mouthOpenTimer -= dt;

      if (state.gameOver) return;

      // Horizontal Movement (Desktop Keyboard OR Mobile Touch Buttons)
      const moveLeft = keys.left || touchInput.left;
      const moveRight = keys.right || touchInput.right;

      if (moveLeft && !moveRight) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (moveRight && !moveLeft) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx *= 0.78;
        if (Math.abs(player.vx) < 8) player.vx = 0;
      }

      // Walk animation cycle
      if (Math.abs(player.vx) > 20 && player.onGround) {
        player.walkCycle += dt * 13;
      } else {
        player.walkCycle = 0;
      }

      // Apply Horizontal Movement & Wall Collisions
      const prevX = player.x;
      player.x += player.vx * dt;

      if (player.x < 24) player.x = 24;
      if (player.x > VW - 24) player.x = VW - 24;

      for (const p of platforms) {
        if (player.y > p.y + 8) {
          if (prevX + 16 <= p.x && player.x + 16 > p.x) {
            player.x = p.x - 16;
            player.vx = 0;
          } else if (prevX - 16 >= p.x + p.w && player.x - 16 < p.x + p.w) {
            player.x = p.x + p.w + 16;
            player.vx = 0;
          }
        }
      }

      // Apply Gravity & Vertical Movement
      const prevY = player.y;
      player.vy += 1720 * dt;
      player.y += player.vy * dt;
      player.onGround = false;

      // Landing on top of platforms
      if (player.vy >= 0) {
        for (const p of platforms) {
          if (player.x + 14 > p.x && player.x - 14 < p.x + p.w) {
            if (prevY <= p.y + 10 && player.y >= p.y) {
              player.y = p.y;
              player.vy = 0;
              player.onGround = true;
            }
          }
        }
      }

      // Landing on top of the bottom-right warp pipe -> Advance to next stage!
      if (
        player.x + 14 > goalPipe.x &&
        player.x - 14 < goalPipe.x + goalPipe.w &&
        player.y >= goalPipe.y - 6
      ) {
        state.score += 250 * state.stage;
        scoreDisplay.textContent = state.score;
        playSound('stageClear');
        spawnFireSparks(goalPipe.x + goalPipe.w / 2, goalPipe.y, 18);
        setupStage(state.stage + 1);
        return;
      }

      // Spike Pit Collisions
      for (const s of spikes) {
        if (
          player.x + 12 > s.x + 6 &&
          player.x - 12 < s.x + s.w - 6 &&
          player.y >= s.y + 12
        ) {
          damagePlayer();
          return;
        }
      }

      // Falling off bottom of screen
      if (player.y > VH + 40) {
        damagePlayer();
        return;
      }

      // Update Chomping Monster
      if (monster.alive) {
        monster.chompPhase += dt * (4.2 + state.stage * 0.35);
        if (monster.hitFlash > 0) monster.hitFlash -= dt;

        const distToMonster = Math.hypot(player.x - monster.x, (player.y - 45) - (monster.y - 75));
        if (distToMonster < 46) {
          damagePlayer();
          return;
        }
      }

      // Update Angled Cannon on Lower Step
      cannon.fireTimer -= dt;
      if (cannon.recoil > 0) cannon.recoil -= dt * 35;
      if (cannon.fireTimer <= 0) {
        cannon.fireTimer = cannon.fireInterval;
        cannon.recoil = 10;
        playSound('cannon');

        const speed = 340 + state.stage * 32;
        const launchAngle = -Math.PI * 0.72 + (Math.random() - 0.5) * 0.14;
        const muzzleX = cannon.x + Math.cos(launchAngle) * 34;
        const muzzleY = cannon.y + Math.sin(launchAngle) * 34;

        cannonballs.push({
          x: muzzleX,
          y: muzzleY,
          vx: Math.cos(launchAngle) * speed,
          vy: Math.sin(launchAngle) * speed - 180,
          radius: 22,
          spin: 0
        });
        spawnPencilDust(muzzleX, muzzleY, 7);
      }

      // Update Player Fireballs
      for (let i = fireballs.length - 1; i >= 0; i--) {
        const fb = fireballs[i];
        fb.x += fb.vx * dt;
        fb.y += fb.vy * dt;
        fb.vy += 680 * dt;
        fb.life -= dt;
        fb.spin += dt * 14;

        // Bounce off platforms
        for (const p of platforms) {
          if (fb.x > p.x && fb.x < p.x + p.w && fb.y + fb.radius >= p.y && fb.y - fb.radius < p.y + 20 && fb.vy > 0) {
            fb.y = p.y - fb.radius;
            fb.vy = -310;
            spawnFireSparks(fb.x, fb.y + fb.radius, 4);
          }
        }

        // Hit Chomping Monster
        if (monster.alive) {
          const hitHead = Math.hypot(fb.x - (monster.x - 8), fb.y - monster.headY) < 42;
          const hitNeck = Math.abs(fb.x - monster.x) < 28 && fb.y > monster.headY && fb.y < monster.y;
          if (hitHead || hitNeck) {
            monster.hp -= 1;
            monster.hitFlash = 0.2;
            playSound('enemyHit');
            spawnFireSparks(fb.x, fb.y, 14);
            fireballs.splice(i, 1);

            if (monster.hp <= 0) {
              monster.alive = false;
              state.score += 150 * state.stage;
              scoreDisplay.textContent = state.score;
              spawnPencilDust(monster.x, monster.headY, 18);
            }
            continue;
          }
        }

        // Hit incoming Cannonballs
        let destroyedBall = false;
        for (let j = cannonballs.length - 1; j >= 0; j--) {
          const cb = cannonballs[j];
          if (Math.hypot(fb.x - cb.x, fb.y - cb.y) < fb.radius + cb.radius) {
            spawnFireSparks(cb.x, cb.y, 12);
            playSound('enemyHit');
            state.score += 50;
            scoreDisplay.textContent = state.score;
            cannonballs.splice(j, 1);
            fireballs.splice(i, 1);
            destroyedBall = true;
            break;
          }
        }
        if (destroyedBall) continue;

        if (fb.life <= 0 || fb.x < -40 || fb.x > VW + 40 || fb.y > VH + 40) {
          fireballs.splice(i, 1);
        }
      }

      // Update Cannonballs
      for (let i = cannonballs.length - 1; i >= 0; i--) {
        const cb = cannonballs[i];
        cb.x += cb.vx * dt;
        cb.y += cb.vy * dt;
        cb.vy += 420 * dt;
        cb.spin -= dt * 5;

        const playerCenterY = player.y - 52;
        if (Math.hypot(cb.x - player.x, cb.y - playerCenterY) < cb.radius + 18) {
          cannonballs.splice(i, 1);
          damagePlayer();
          return;
        }

        if (cb.x < -60 || cb.y > VH + 60) {
          cannonballs.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    // =========================================================================
    // PENCIL SKETCH RENDERING HELPERS
    // =========================================================================

    function sketchLine(x1, y1, x2, y2, width = 2.6, color = '#4d4d4d') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = width;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const midX = (x1 + x2) / 2 + Math.sin(x1 * 0.05 + y1 * 0.05) * 0.9;
      const midY = (y1 + y2) / 2 + Math.cos(x2 * 0.05 + y2 * 0.05) * 0.9;
      ctx.quadraticCurveTo(midX, midY, x2, y2);
      ctx.stroke();

      ctx.globalAlpha = 0.35;
      ctx.lineWidth = width * 0.7;
      ctx.beginPath();
      ctx.moveTo(x1 + 1.2, y1 - 0.8);
      ctx.lineTo(x2 - 0.8, y2 + 1.1);
      ctx.stroke();
      ctx.restore();
    }

    function drawPaperLines() {
      ctx.save();
      ctx.strokeStyle = 'rgba(180, 185, 195, 0.14)';
      ctx.lineWidth = 1;
      for (let y = 60; y < VH; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(VW, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPlatformsAndSpikes() {
      ctx.fillStyle = '#fcfcf9';
      for (const p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }

      // Platform 1 (left)
      sketchLine(0, 455, 350, 455, 3.2);
      sketchLine(350, 455, 350, 720, 3.2);

      // Platform 2 (middle)
      sketchLine(455, 720, 455, 455, 3.2);
      sketchLine(455, 455, 780, 455, 3.2);
      sketchLine(780, 455, 780, 720, 3.2);

      // Platform 3 (stepped right block)
      sketchLine(870, 720, 870, 455, 3.2);
      sketchLine(870, 455, 1055, 455, 3.2);
      sketchLine(1055, 455, 1055, 525, 3.2);
      sketchLine(1055, 525, 1165, 525, 3.2);
      sketchLine(1165, 525, 1165, 720, 3.2);

      // Jagged Spikes in Gap 1 and Gap 2
      for (const s of spikes) {
        const stepW = s.w / s.count;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x, VH);
        for (let i = 0; i < s.count; i++) {
          const sx = s.x + i * stepW;
          const peakX = sx + stepW * 0.5;
          const peakY = s.y + (i % 2 === 0 ? 0 : 8);
          ctx.lineTo(peakX, peakY);
          ctx.lineTo(sx + stepW, s.y + 38);
        }
        ctx.lineTo(s.x + s.w, VH);
        ctx.closePath();
        ctx.fillStyle = 'rgba(130, 130, 130, 0.16)';
        ctx.fill();

        for (let i = 0; i < s.count; i++) {
          const sx = s.x + i * stepW;
          const peakX = sx + stepW * 0.5;
          const peakY = s.y + (i % 2 === 0 ? 0 : 8);
          sketchLine(sx, i === 0 ? VH : s.y + 38, peakX, peakY, 2.8);
          sketchLine(peakX, peakY, sx + stepW, i === s.count - 1 ? VH : s.y + 38, 2.8);
        }
        ctx.restore();
      }
    }

    function drawGoalPipe() {
      const { x, y, w, h } = goalPipe;
      ctx.save();
      ctx.fillStyle = '#f5f5f0';
      ctx.fillRect(x + 8, y + 22, w - 16, h - 22);
      sketchLine(x + 8, y + 22, x + 8, y + h, 2.8);
      sketchLine(x + w - 8, y + 22, x + w - 8, y + h, 2.8);

      ctx.fillStyle = '#eeeee8';
      ctx.beginPath();
      ctx.roundRect(x, y, w, 24, 10);
      ctx.fill();
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = '#4d4d4d';
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + 11, w * 0.36, 5.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(85, 85, 85, 0.25)';
      ctx.fill();
      ctx.stroke();

      const bob = Math.sin(state.wobbleTime * 4) * 4;
      ctx.fillStyle = '#555';
      ctx.font = '20px "Patrick Hand", cursive';
      ctx.textAlign = 'center';
      ctx.fillText('GOAL ↓', x + w / 2, y - 10 + bob);
      ctx.restore();
    }

    function drawPlayer() {
      if (player.invulnTimer > 0 && Math.floor(player.invulnTimer * 14) % 2 === 0) {
        return;
      }

      ctx.save();
      ctx.translate(player.x, player.y);

      const walkSwing = Math.sin(player.walkCycle) * 14;
      const armSwing = Math.cos(player.walkCycle) * 12;

      // Legs
      sketchLine(0, -34, -14 + walkSwing, 0, 2.8);
      sketchLine(0, -34, 14 - walkSwing, 0, 2.8);

      // Torso
      sketchLine(0, -68, 0, -34, 2.8);

      // Arms
      if (player.mouthOpenTimer > 0) {
        sketchLine(0, -58, player.facing * 26, -64, 2.8);
        sketchLine(0, -58, -player.facing * 14, -44, 2.8);
      } else {
        sketchLine(0, -58, -18 - armSwing, -40, 2.8);
        sketchLine(0, -58, 18 + armSwing, -40, 2.8);
      }

      // Head & Hair
      ctx.save();
      ctx.translate(0, -90);
      if (player.facing === -1) ctx.scale(-1, 1);

      ctx.fillStyle = '#fdfdfb';
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = '#4d4d4d';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-22, 2, 5.5, Math.PI * 0.4, Math.PI * 1.6);
      ctx.fillStyle = '#f4f4ef';
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-21, -4);
      ctx.quadraticCurveTo(-24, -27, 4, -27);
      ctx.quadraticCurveTo(22, -26, 25, -15);
      ctx.quadraticCurveTo(10, -18, -4, -13);
      ctx.quadraticCurveTo(-15, -10, -21, -4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(110, 110, 110, 0.42)';
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#3f3f3f';
      ctx.beginPath();
      ctx.ellipse(-3, 0, 2.3, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(8, 0, 2.3, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      if (player.mouthOpenTimer > 0) {
        ctx.arc(3, 10, 4, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.arc(2.5, 8, 6.5, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }

      ctx.restore();
      ctx.restore();
    }

    function drawMonster() {
      if (!monster.alive) return;

      ctx.save();
      const chompAngle = (Math.sin(monster.chompPhase) + 1) * 0.24;
      const sway = Math.sin(monster.chompPhase * 0.5) * 4;

      ctx.lineWidth = 2.8;
      ctx.strokeStyle = monster.hitFlash > 0 ? '#d9534f' : '#4d4d4d';
      ctx.fillStyle = '#fafaf6';

      ctx.beginPath();
      ctx.moveTo(monster.x - 10, monster.y);
      ctx.quadraticCurveTo(monster.x - 10 + sway, 385, monster.x - 12 + sway, 332);
      ctx.lineTo(monster.x + 8 + sway, 332);
      ctx.quadraticCurveTo(monster.x + 10 + sway, 385, monster.x + 10, monster.y);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(monster.x - 4 + sway, 318);

      ctx.save();
      ctx.rotate(chompAngle);
      ctx.beginPath();
      ctx.moveTo(14, -2);
      ctx.quadraticCurveTo(14, -24, -10, -24);
      ctx.quadraticCurveTo(-32, -24, -34, -8);
      ctx.lineTo(-6, -4);
      ctx.closePath();
      ctx.fillStyle = '#f8f8f3';
      ctx.fill();
      ctx.stroke();

      sketchLine(-28, -8, -24, -1, 2);
      sketchLine(-20, -7, -16, 0, 2);
      sketchLine(-12, -6, -9, 1, 2);
      ctx.restore();

      ctx.save();
      ctx.rotate(-chompAngle);
      ctx.beginPath();
      ctx.moveTo(12, 4);
      ctx.lineTo(-30, 8);
      ctx.quadraticCurveTo(-28, 22, -6, 22);
      ctx.quadraticCurveTo(12, 22, 12, 4);
      ctx.closePath();
      ctx.fillStyle = '#f8f8f3';
      ctx.fill();
      ctx.stroke();

      sketchLine(-25, 8, -21, 1, 2);
      sketchLine(-17, 7, -13, 0, 2);
      ctx.restore();

      ctx.restore();

      for (let h = 0; h < monster.maxHp; h++) {
        ctx.beginPath();
        ctx.arc(monster.x - 12 + h * 14, 275, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = h < monster.hp ? '#555' : 'transparent';
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawCannon() {
      ctx.save();
      const recoilX = -Math.cos(cannon.angle) * cannon.recoil;
      const recoilY = -Math.sin(cannon.angle) * cannon.recoil;
      ctx.translate(cannon.x + recoilX, cannon.y + recoilY);
      ctx.rotate(cannon.angle);

      ctx.beginPath();
      ctx.roundRect(-22, -20, 48, 40, 8);
      ctx.fillStyle = 'rgba(105, 105, 105, 0.48)';
      ctx.fill();
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = '#4d4d4d';
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(24, 0, 7, 20, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(70, 70, 70, 0.55)';
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawCannonballs() {
      for (const cb of cannonballs) {
        ctx.save();
        ctx.translate(cb.x, cb.y);
        ctx.rotate(cb.spin);

        ctx.beginPath();
        ctx.arc(0, 0, cb.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(85, 85, 85, 0.72)';
        ctx.fill();
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = '#3f3f3f';
        ctx.stroke();

        ctx.strokeStyle = 'rgba(45, 45, 45, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-12, -8);
        ctx.lineTo(8, 12);
        ctx.moveTo(-6, -14);
        ctx.lineTo(14, 6);
        ctx.moveTo(-14, 2);
        ctx.lineTo(2, 16);
        ctx.stroke();

        ctx.restore();
      }
    }

    function drawFireballs() {
      for (const fb of fireballs) {
        ctx.save();
        ctx.translate(fb.x, fb.y);
        ctx.rotate(fb.spin);

        ctx.beginPath();
        for (let a = 0; a < 8; a++) {
          const ang = (a / 8) * Math.PI * 2;
          const r = a % 2 === 0 ? fb.radius + 5 : fb.radius - 3;
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 145, 45, 0.85)';
        ctx.fill();
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = '#4a3525';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, fb.radius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#fff3b0';
        ctx.fill();

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const pt of particles) {
        const alpha = Math.max(0, pt.life / pt.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.type === 'flame' ? '#ff8c24' : '#555';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 3 Hand-Drawn Hearts positioned cleanly in the upper-left HUD (above playfield & out of touch-button way)
    function drawHeartsHUD() {
      const startX = 48;
      const startY = 98;
      const spacing = 54;

      for (let i = 0; i < state.maxHearts; i++) {
        const hx = startX + i * spacing;
        const hy = startY;
        const isFull = i < state.hearts;

        ctx.save();
        ctx.translate(hx, hy);
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.bezierCurveTo(-22, -2, -24, -22, -9, -22);
        ctx.bezierCurveTo(-2, -22, 0, -13, 0, -11);
        ctx.bezierCurveTo(0, -13, 2, -22, 9, -22);
        ctx.bezierCurveTo(24, -22, 22, -2, 0, 15);
        ctx.closePath();

        if (isFull) {
          ctx.fillStyle = 'rgba(225, 85, 85, 0.28)';
          ctx.fill();
        }
        ctx.lineWidth = 2.8;
        ctx.strokeStyle = isFull ? '#4d4d4d' : 'rgba(120, 120, 120, 0.4)';
        ctx.stroke();
        ctx.restore();
      }
    }

    // Main Render Loop
    function render() {
      const dpr = window.devicePixelRatio || 1;
      const displayW = canvas.clientWidth;
      const displayH = canvas.clientHeight;
      if (canvas.width !== Math.floor(displayW * dpr) || canvas.height !== Math.floor(displayH * dpr)) {
        canvas.width = Math.floor(displayW * dpr);
        canvas.height = Math.floor(displayH * dpr);
      }

      ctx.save();
      ctx.scale(canvas.width / VW, canvas.height / VH);

      ctx.clearRect(0, 0, VW, VH);

      if (state.screenShake > 0) {
        const mag = state.screenShake * 24;
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
      }

      drawPaperLines();
      drawPlatformsAndSpikes();
      drawGoalPipe();
      drawCannon();
      drawMonster();
      drawCannonballs();
      drawFireballs();
      drawPlayer();
      drawParticles();
      drawHeartsHUD();

      ctx.restore();
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      setupStage(1);
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
